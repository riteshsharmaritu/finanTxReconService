server:
  port: 8080

spring:
  application:
    name: finantx-recon-service
  datasource:
    url: jdbc:h2:mem:finantx;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console

anomaly:
  rules-file: classpath:anomaly-rules.json
